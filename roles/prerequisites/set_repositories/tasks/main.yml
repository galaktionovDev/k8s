---
- name: Delete content from apt
  ansible.builtin.file:
    state: absent
    path: /etc/apt/sources.list

- name: config apt proxy
  ansible.builtin.template:
    src: apt-proxy.j2
    dest: /etc/apt/apt.conf.d/ansible
    owner: root
    group: root
    mode: "0644"
  when:
    - set_repositories_apt_proxy | length > 0

- name: template auth file
  template:
    src: auth.j2
    dest: /etc/apt/auth.conf.d/ansible
    owner: root
    group: root
    mode: 0600
  no_log: "{{ set_repositories_no_log }}"

- name: "set_repositories"
  import_tasks: set-repositories.yml
  when: set_repositories_requared_repo | length > 0
