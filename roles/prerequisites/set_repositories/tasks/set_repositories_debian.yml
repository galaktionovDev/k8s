---

- name: "set_repositories | add trust to repos from set_repositories_required_repo variable"
  apt_key:
    url: "{{ item.key_url | default(omit) }}"
    state: present
    data: "{{ item.data | default(omit) }}"
    validate_certs: false
  when:
    - item.name is defined
    - item.key_url is defined or item.data is defined
  loop: "{{ set_repositories_repo_keys.apt }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true  # Ignoring errors if there's no internet

- name: "set_repositories | add required repo from set_repositories_repo_keys using copy"
  block:

    - name: Build list of /etc/apt/sources.list.d repositories
      set_fact:
        allowed_apt_source_files: >-
          {{
            (set_repositories_required_repo.apt | default([]) | map(attribute='name') | list | unique)
            | map('regex_replace', '^(.*)$', '/etc/apt/sources.list.d/\\1.list')
            | list
          }}
      ignore_errors: true

    - name: Find existing APT sources in sources.list.d
      find:
        paths: /etc/apt/sources.list.d
        file_type: file
        patterns:
          - "*.list"
          - "*.sources"
      register: apt_source_files
      ignore_errors: true

    - name: Comment out all lines in sources.list
      replace:
        path: "/etc/apt/sources.list"
        regexp: '^(.*)$'
        replace: '#\1'
      ignore_errors: yes

    - name: Disable all non-required APT sources
      command: mv "{{ item.path }}" "{{ item.path }}.disabled"
      args:
        creates: "{{ item.path }}.disabled"
      loop: "{{ apt_source_files.files | default([]) }}"
      when: item.path not in (allowed_apt_source_files | default([]))
      ignore_errors: true

    - name: "Add repository to {{ item.name }} copy"
      copy:
        dest: "/etc/apt/sources.list.d/{{ item.name }}.list"
        content: "{{ item.repo_string }}"
        owner: "root"
        group: "root"
        mode: "0644"
      when:
        - item.name is defined
        - item.repo_string is defined
      loop: "{{ set_repositories_required_repo.apt }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Pin Package and dependencies to version  on Debian # Remove after separate repos
      copy:
        dest: /etc/apt/preferences.d/debian-pin
        content: |
          Package: iptables libxtables12 libip4tc2 libip6tc2
          Pin: version 1.8.7-1
          Pin-Priority: 1001

          Package: libnfnetlink0
          Pin: version 1.0.1-3
          Pin-Priority: 1001

          Package: parted
          Pin: version 	3.4-1
          Pin-Priority: 1001
        owner: root
        group: root
        mode: '0644'
      when: ansible_distribution.split(' ') | first | lower in ['debian']
    
    - name: Pin Package and dependencies to version on Astra Linux # Remove after separate repos
      copy:
        dest: /etc/apt/preferences.d/99-astra-pins
        content: |
          Package: iptables libxtables12 libip4tc2 libip6tc2
          Pin: version 1.8.9-2+b2
          Pin-Priority: 1001

          Package: parted
          Pin: version 3.4-1
          Pin-Priority: 1001
        owner: "root"
        group: "root"
        mode: "0644"
      when: ansible_distribution.split(' ') | first | lower in ['astra']  

    - name: Update apt cache
      command: apt-get update
      ignore_errors: true  # Ignoring errors if there's no internet
  # when: ansible_distribution.split(' ') | first | lower in ['astra']

