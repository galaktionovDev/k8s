- name: Install additional packages for RHEL
  ansible.builtin.dnf:
    name: "{{ set_packages_addition_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 60
  when:
    - set_packages_addition_packages | length > 0
    - ansible_pkg_mgr in ['dnf', 'yum']

- name: Remove unnecessary packages for RHEL
  ansible.builtin.dnf:
    name: "{{ set_packages_unnecessary_packages }}"
    state: absent
  when:
    - set_packages_unnecessary_packages | length > 0
    - ansible_pkg_mgr in ['dnf', 'yum']

- name: Hold (exclude) addition packages for RHEL
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: "^exclude="
    line: "exclude={% for package in set_packages_addition_packages %}{{ package | split('=') | first }}{% if not loop.last %} {% endif %}{% endfor %}"
    create: true
    mode: '0644'
  when:
    - set_packages_addition_packages | length > 0
    - set_packages_hold | bool
    - ansible_pkg_mgr == 'dnf'