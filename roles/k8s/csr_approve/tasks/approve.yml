---
- name: get pending workers CSR's
  connection: local
  become: "{{ csr_approve_become }}"
  run_once: true
  kubernetes.core.k8s_info:
    api_version: certificates.k8s.io/v1
    kind: certificatesigningrequests
    kubeconfig: "{{ csr_approve_kubeconfig }}"
  register: csr_approve_csr

- name: approve pending workers CRS's
  ansible.builtin.command: "kubectl certificate approve {{ item.metadata.name }}"
  delegate_to: "{{ groups['masters'] | first }}"
  become: true
  environment:
    KUBECONFIG: "/etc/kubernetes/admin.conf"
  changed_when: true
  failed_when: false
  when:
    - "('system:node:' + inventory_hostname) == item.spec.username"
  loop: "{{ csr_approve_csr.resources |rejectattr('status.conditions.0.type', 'defined') | list }}"
