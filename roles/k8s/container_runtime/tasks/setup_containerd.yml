---
# tasks file for setup_containerd

- name: "Setup_containerd | Configure required kernel modules to load at startup and trigger reload if needed"
  become: true
  template:
    src: modules_containerd.conf.j2
    dest: /etc/modules-load.d/containerd.conf
    mode: "0644"
    owner: root
    group: root

- name: template crictl config
  template:
    src: crictl.yaml.j2
    dest: /etc/crictl.yaml
    mode: "0644"
    owner: root
    group: root

- name: "Setup_containerd | Check loaded kernel modules"
  become: true
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ cr_containerd_kernel_modules }}"

- name: "Setup_containerd | Install containerd apt packages "
  become: true
  ansible.builtin.apt:
    name: "{{ cr_containerd_packages_names }}"
    state: present
    update_cache: true
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']

- name: "Setup_containerd | Prevent containerd apt package update"
  become: true
  ansible.builtin.apt:
    name: "{{ cr_containerd_hold_package_name }}"
    state: present
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']

- name: "Setup_containerd | Install containerd dnf packages "
  become: true
  ansible.builtin.dnf:
    name: "{{ cr_containerd_packages_names }}"
    state: present
    update_cache: true
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux']

- name: "Setup_containerd | Prevent containerd dnf package update"
  become: true
  ansible.builtin.dnf:
    name: "{{ cr_containerd_hold_package_name }}"
    state: present
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux']

- name: "Setup_containerd | Create /etc/containerd directory"
  become: true
  file:
    path: /etc/containerd
    state: directory
    mode: "0644"
    owner: root
    group: root

- name: "Setup_containerd | Ensure /app directory exists"
  become: true
  file:
    path: "/app"
    state: directory
    mode: "0644"
    owner: root
    group: root

- name: "Setup_containerd | Configure containerd root directory {{ cr_containerd_root_dir_path }}"
  become: true
  file:
    path: "{{ cr_containerd_root_dir_path }}"
    state: directory
    mode: "0644"
    owner: root
    group: root

- name: "Setup_containerd | Configure containerd config /etc/containerd/config.toml"
  no_log: "{{ cr_no_log }}"
  become: true
  template:
    src: containerd_config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
    owner: root
    group: root
  notify: "restart containerd"
