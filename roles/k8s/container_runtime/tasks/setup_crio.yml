---
# tasks file for setup_crio
- name: "Setup_crio | Determine OCI runtime per OS"
  ansible.builtin.set_fact:
    cr_crio_runtime: >-
      {{ 'crun'
         if ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux']
         else 'runc' }}

- name: "Setup_crio | Configure required kernel modules to load at startup and trigger reload if needed"
  template:
    src: modules_crio.conf.j2
    dest: /etc/modules-load.d/crio.conf
    mode: "0644"
    owner: root
    group: root
  notify: "restart crio"

- name: "Setup_crio | Check loaded kernel modules"
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ cr_crio_kernel_modules }}"
  notify: "restart crio"

- name: "Setup crio | Ensure sysctl is set"
  ansible.posix.sysctl:
    name: "{{ item.split('=')[0] }}"
    value: "{{ item.split('=')[1] }}"
    reload: true
    sysctl_set: true
    state: present
  loop: "{{ cr_crio_sysctl_parameters }}"

- name: template crictl config
  template:
    src: crictl-crio.yaml.j2
    dest: /etc/crictl.yaml
    mode: "0644"
    owner: root
    group: root
  notify: "restart crio"

- name: Setup_crio | Install Astra Linux specific packages
  vars:
    apt_install:
      - libip6tc2=1.8.9-2+b2
      - iptables=1.8.9-2+b2
      - cri-o=1.34.0-1.1
      - cri-tools=1.34.0-1.1
  ansible.builtin.import_role:
    name: common/apt_install
  when: ansible_distribution.split(' ') | first | lower in ['astra']

- name: Setup_crio | Install apt packages
  vars:
    apt_install: "{{ cr_crio_packages_names }}"
  ansible.builtin.import_role:
    name: common/apt_install
  notify:
    - "restart crio"
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'debian']

- name: Setup_crio | Install dnf packages
  vars:
    dnf_install: "{{ cr_crio_dnf_packages_names }}"
  ansible.builtin.import_role:
    name: common/dnf_install
  notify:
    - "restart crio"
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux']

- name: RedOS/RHEL specific OS preparations (Firewall, NTP, SELinux)
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux']
  block:
    - name: Stop and disable firewalld
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Force NTP synchronization (chrony)
      ansible.builtin.command: chronyc -a makestep
      become: true
      # Специально без ignore_errors: если время не синхронизируется, деплой упадет с понятной ошибкой до старта k8s

    - name: Wait for NTP sync completion (chrony)
      ansible.builtin.command: chronyc waitsync 10
      become: true

    - name: Configure SELinux for Containers (Keep Enforcing)
      when: 
        - ansible_selinux is defined
        - ansible_selinux.status == 'enabled'
      block:
        - name: Allow containers to manage cgroup and use devices
          ansible.builtin.seboolean:
            name: "{{ item }}"
            state: true
            persistent: true
          loop:
            - container_manage_cgroup
            - container_use_devices

        - name: Add ports for Kubernetes and Cilium to SELinux
          community.general.seport:
            ports: "{{ item.ports }}"
            proto: "{{ item.proto }}"
            setype: "container_port_t"
            state: present
          loop:
            - { ports: "10250", proto: "tcp" } # Kubelet
            - { ports: "6081", proto: "udp" }  # Cilium Geneve (туннелирование по умолчанию)
            - { ports: "8472", proto: "udp" }  # Cilium VXLAN
            - { ports: "4240", proto: "tcp" }  # Cilium Health
            - { ports: "4244", proto: "tcp" }  # Hubble Server
            - { ports: "4245", proto: "tcp" }  # Hubble Relay

- name: Debian/Ubuntu/Astra Force NTP synchronization
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
  become: true
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']
  ignore_errors: true # Astra может использовать другой сервис времени

- name: Setup_crio | Create directories (logs, storage, etc)
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0644"
  loop:
    - /app
    - /etc/crio
    - "{{ cr_crio_root_dir_path }}"
    - "{{ cr_crio_root_dir_path }}/logs/pods"
    - "{{ cr_crio_root_dir_path }}/containers/storage"

- name: "Setup_crio | Configure crio config /etc/crio/crio.conf"
  no_log: "{{ cr_no_log }}"
  template:
    src: crio_config.j2
    dest: /etc/crio/crio.conf
    mode: "0644"
    owner: root
    group: root
  notify:
    - "restart crio"

- name: "Setup_mirroring | Configure crio registries.conf config /etc/containers/registries.conf"
  no_log: "{{ cr_no_log }}"
  template:
    src: registries.conf.j2
    dest: /etc/containers/registries.conf
    mode: "0644"
    owner: root
    group: root
  notify: "restart crio"

- name: "Setup_auth | Configure crio credentials auth registy config /etc/crio/config.json"
  no_log: "{{ cr_no_log }}"
  template:
    src: config-auth.json.j2
    dest: /etc/crio/config.json
    mode: "0644"
    owner: root
    group: root
  when:
    - cr_crio_auth_hostname | length > 0
    - "cluster_registry_login is defined"
    - "cluster_registry_passwd is defined"
  notify:
    - "restart crio"

- name: Setup_crio | Remove crio cni
  file:
    path: "/etc/cni/net.d/100-crio-bridge.conf"
    state: absent
  notify:
    - "restart crio"

- name: Force restart crio
  run_once: true
  ansible.builtin.command:
    cmd: 'true'
  when: cr_crio_force_restart | bool
  notify:
    - "restart crio"
